# this is for basic SARSA Q-learning model
    project: "AI_Clininician"
    "group": "reinforcement_learning"
    name: "basic_q"

    tuning: True

    # Early stopping parameters (fixed for all combinations)    
    use_early_stopping: False
    patience: 200       # Stop if no improvement for 15 evaluations

    window_length: 72 # 72 hours, same as dynamic deephit - we want to use same state representation, but we can simply use
    # transformer ouput from dynamic deephit - set by use_raw_states
    use_raw_states: False # if true, will use the raw features as states,
    # if false, uses transformer output


    n_episodes: 1000  # How many episodes run during evaluation
    # n_epochs: 10  # Max time steps to run environment - should be 1000, but for testing we set to 10 - NOW ADDED TO COMMAND LINE ARGUMENTS
    checkpoints_path: "/home/jake/Documents/AI_Clinician/model_checkpoints"  # Save path
    discount: [0.7, 0.8] #[0.8, 0.9, 0.95, 0.99]  # Discount factor
    # frac: 0.  # Best data fraction to use - NOW ADDED TO COMMAND LINE ARGUMENTS
    # max_traj_len: 72  # Max trajectory length - probably need to change this - in data config
    device: "cuda"  # Device (cuda or cpu)
    learning_rate: "loguniform(1e-5, 1e-4)" # "loguniform(3e-5, 1e-4)"           #      [1e-6]  # Learning rates to try
    dropout:  "uniform(0.1, 0.3)"   # "uniform(0.0, 0.3)"
    tau: [0.005, 0.01]   # [0.0005, 0.001, 0.005, 0.01] # Target network update rate
    weight_decay: "loguniform(1e-5, 1e-2)" # "loguniform(1e-5, 1e-2)" # L2 regularization strength
    # policy_noise: 0.2 # Noise added to target policy during critic updates
    batch_size: 1024  # Batch size for all networks
    hidden_dim: [512, 1024]  # Hidden dimension for all networks [128, 256, 256]] 


    eval_freq: 1        # Evaluate every 20 epochs  
    min_delta: 0.0001   # Minimum improvement threshold

    # evaluation parameters
    monitor_v0: False  # Whether to monitor V0 during training - specific to TD3-BC

    # validation loss
    loss_metric: "critic_loss"  # Which metric to use for early stopping
    # changes to reward structure
    make_rewards_positive: False  # Whether to shift rewards to be positive

    # include next actions
    include_next_actions: True  # needed for SARSA

    # gradient clipping
    grad_clip: 0.5 # [0.5, 1.0]
    
    # health score reward shaping parameters
    reward_scaling: 1.5  # Scaling factor for rewards
    health_score_scale: 0.1 # [0.05, 0.1, 0.2]  # Scaling factor for health score component of reward
    health_score_hourly_change_scale: 0.5 # [0.5, 1]  # Scaling factor for hourly change component of reward

