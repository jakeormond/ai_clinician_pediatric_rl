# this is for basic SARSA Q-learning model
    project: "AI_Clininician"
    "group": "reinforcement_learning"
    name: "basic_q"
    n_episodes: 1000  # How many episodes run during evaluation
    # n_epochs: 10  # Max time steps to run environment - should be 1000, but for testing we set to 10 - NOW ADDED TO COMMAND LINE ARGUMENTS
    checkpoints_path: "/home/jake/Documents/AI_Clinician/model_checkpoints"  # Save path
    discount: 0.99  # Discount factor
    # frac: 0.  # Best data fraction to use - NOW ADDED TO COMMAND LINE ARGUMENTS
    # max_traj_len: 72  # Max trajectory length - probably need to change this - in data config
    device: "cuda"  # Device (cuda or cpu)
    learning_rate: "loguniform(1e-5, 5e-5)"           #      [1e-6]  # Learning rates to try
    dropout: "uniform(0.2, 0.22)"
    tau: 0.01 # Target network update rate
    policy_noise: 0.2 # Noise added to target policy during critic updates
    batch_size: [256]  # Batch size for all networks
    hidden_dim: [[128, 128]]  # Hidden dimension for all networks [128, 256, 256]] 

    # Early stopping parameters (fixed for all combinations)
    patience: 6        # Stop if no improvement for 15 evaluations
    eval_freq: 5       # Evaluate every 20 epochs  
    min_delta: 0.0001   # Minimum improvement threshold

    # evaluation parameters
    monitor_v0: False  # Whether to monitor V0 during training - specific to TD3-BC

    # validation loss
    loss_metric: "critic_loss"  # Which metric to use for early stopping
    # changes to reward structure
    make_rewards_positive: False  # Whether to shift rewards to be positive

    # include next actions
    include_next_actions: True  # needed for SARSA


