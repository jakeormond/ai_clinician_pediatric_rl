project: "AI_Clininician"
"group": "supervised_learning"
name: "bc_transformer"

device: "cuda"  # Device (cuda or cpu)

# use smaller tuning set
tuning: False

# loss type
loss_metric: "total_loss" # "combined_loss"  # Which metric to use for early stopping
loss_scale: 0.05 # Scale factor for total loss
mse_loss_weight: 10.0 # Scale factor for MSE component of loss when using combined loss - set higher than binary loss since MSE values smaller and we want to encourage improvement

# batch size
batch_size: 64  # Batch size for all networks

# window size
window_length: 72 #168 # Prediction horizon in hours - so 1 month

# parameters:
learning_rate: "loguniform(1e-5, 3e-4)"  
weight_decay: "loguniform(1e-5, 1e-2)" # L2 regularization strength
grad_clip: [0.1, 0.5, 1.0]

# transformer capacity
d_model: [64, 128, 256] # Dimension of the model
num_encoder_layers: [2, 4, 6]  # Number of encoder layers
nhead: [4, 8]  # Number of attention heads
ff_factor: [2, 4]  # Dimension of feedforward network in transformer

# regularization
dropout: "uniform(0.1, 0.3)"
feature_dropout_p: "uniform(0.0, 0.2)" # 0.0 means 'off', up to 20% features dropped

# learning rate scheduling parameters
pct_start: 0.1
div_factor: 25

# Early stopping parameters (fixed for all combinations)
early_stopping_flag: False  # Whether to use early stopping
patience: 15        # Stop if no improvement for 15 evaluations
eval_freq: 1       # Evaluate every 20 epochs  
min_delta: 0.0001   # Minimum improvement threshold

# for controls
shuffle_inputs: False  # Whether to shuffle feature columns to confirm transformer not looking ahead
zero_inputs: False  # Whether to zero out feature columns to confirm transformer not looking ahead

# actions to leave out of last time step for RL setting
# actions: ['fio2', 'peep_set', 'tidal_volume_set'] # for mimic_iv ventilation
actions: [['intake', 'vis']] # for choc sepsis
actions_in_state: True # whether to include action features in the state representation for the transformer - False is ablation
vaso_loss_weight: 5.0 # weight on vaso loss in combined loss function for sepsis - set higher than iv weight since vaso predictions worse and we want to encourage improvement
# actions: ['combined_hourly_iv', 'vasoactive_inotropic_score'] # for mimic sepsis
use_binary_loss: True # whether to include the binary loss component in addition to the regression loss for the vaso channel - ablation