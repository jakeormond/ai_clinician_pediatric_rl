    project: "AI_Clininician"
    "group": "reinforcement_learning"
    name: "conservative_q_learning"
    
    tuning: False
    
    n_episodes: 1000  # How many episodes run during evaluation
    # n_epochs: 10  # Max time steps to run environment - should be 1000, but for testing we set to 10 - NOW ADDED TO COMMAND LINE ARGUMENTS
    checkpoints_path: "/home/jake/Documents/AI_Clinician/model_checkpoints"  # Save path
    discount: 0.99 # 0.95 # 0.999  # Discount factor
    # frac: 0.  # Best data fraction to use - NOW ADDED TO COMMAND LINE ARGUMENTS
    # max_traj_len: 2000  # Max trajectory length - probably need to change this
    device: "cuda"  # Device (cuda or cpu)
    learning_rate_critic: 6.e-5 # 5e-6 # "loguniform(1e-4, 1e-3)"   
    learning_rate_actor: 6e-5  # "loguniform(1e-4, 1e-3)"   
    dropout: 0.1 # 0.05 # "uniform(0.0, 0.5)"
    tau: 0.005 # 0.0005 # Target network update rate
    weight_decay: 1.e-5 #1e-4 # L2 regularization strength
    
    policy_noise: 0.2 # Noise added to target policy during critic updates
    noise_clip: 0.5 # Range to clip target policy noise
    policy_freq: 2 # Frequency of delayed policy updates
    beta: 0.1 # Weighting for BC loss term
    cql_alpha: 0. # 0.001 #.001 # Weighting for CQL penalty term
    temp: 1.0 # Temperature for CQL penalty term
    num_samples: 10 # Number of samples for CQL penalty term

    batch_size: 1024 # [256, 512, 1024]  # Batch size for all networks
    hidden_dim: 128 # [[128, 128], [128, 256, 256]]  # Hidden dimension for all networks

    # Early stopping parameters (fixed for all combinations)
    early_stopping_flag: False  # Whether to use early stopping
    patience: 3        # Stop if no improvement for 15 evaluations
    eval_freq: 1       # Evaluate every 20 epochs  
    min_delta: 0.0001   # Minimum improvement threshold

    # evaluation parameters
    monitor_v0: True  # Whether to monitor V0 during training - specific to TD3-BC

    # validation loss
    loss_metric: "bellman_loss"  # Which metric to use for validation loss

    # changes to reward structure
    make_rewards_positive: False  # Whether to shift rewards to be positive

    # include next actions
    include_next_actions: True  # needed for SARSA

    # gradient clipping
    grad_clip: 1.0

    # health score reward shaping parameters
    health_score_hourly_change_clip: 10. # health score is 0 to 100, clip prevents large spikes in reward
    health_score_scale: 0. # [0.05, 0.1, 0.2]  # Scaling factor for health score component of reward
    health_score_hourly_change_scale: 1. # [0.5,
    total_health_score_scale: 10.  # Scaling factor for total health score component of reward
    potential_based_reward_shaping: False 
    terminal_health_score_reward: 2.  # the scale of terminal reward (used with pbrs) relative to the health score reward - this is added as a terminal reward for trajectories that end in mortality (negative) or survival (positive) to incentivize the model to learn from the final outcome of the trajectory

    monte_carlo_terminal_returns: False

    use_compressed_latents: True  # Whether to use compressed latents as states instead of raw features or transformer output - specific to basic Q model, not used for TD3-BC or CQL