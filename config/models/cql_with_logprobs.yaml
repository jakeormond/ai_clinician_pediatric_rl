    project: "AI_Clininician"
    "group": "reinforcement_learning"
    name: "cql_with_logprobs"
    device: "cuda"  # Device (cuda or cpu) 
    
    tuning: False
    
    n_episodes: 1000  # How many episodes run during evaluation

    # reward_type: "health_score" # "terminal" # "health_score" - set my launch or pbs
    discount: 0.975  # Discount factor
    terminal_discount: 0.998 # discount for terminal health-score-based rewards

    # health score reward shaping parameters
    health_score_hourly_change_clip: 100. # health score is 0 to 100, clip prevents large spikes in reward
    health_score_scale: 0. # [0.05, 0.1, 0.2]  # Scaling factor for health score component of reward
    health_score_hourly_change_scale: 1. # [0.5,
    total_health_score_scale: 1.  # Scaling factor for total health score component of reward
    terminal_reward_scale: 10.  # the scale of terminal reward 

    # seeds 
    use_fixed_seed: True # # Whether to use a fixed seed for reproducibility, otherwise randomly generated
    seed: 42 # Seed value to use if use_fixed_seed is True

    # add reward to vaso dosing as positive control expt
    add_reward_to_vaso_dosing: False  # Whether to add reward to vaso dosing as positive control expt - this is added as a reward for trajectories that end in mortality (negative) or survival (positive) to incentivize the model to learn from the final outcome of the trajectory
    vaso_reward_coefficient: [0.01, 0.05, 0.1, 0.2, 0.5] # [1.0, 5.0] # [0.2, 0.5, 1.0, 5.0]

    learning_rate_critic: 1.e-4 # 1.e-5 # 5e-6 # "loguniform(1e-4, 1e-3)"   
    learning_rate_actor: 1.e-3 # 1e-4  # "loguniform(1e-4, 1e-3)"   
    dropout: 0.1 # 0.05 # "uniform(0.0, 0.5)"
    tau: 0.001 # 0.0005 # Target network update rate
    weight_decay: 1.e-5 #1e-4 # L2 regularization strength
    
    policy_noise: 0.2 # Noise added to target policy during critic updates
    noise_clip: 0.5 # Range to clip target policy noise
    policy_freq: 2 # Frequency of delayed policy updates

    cql_alpha: [0.5, 0.1, 0.05, 0.01] #  [0.005, 0.006, 0.007, 0.008, 0.009] # [0.006, 0.007, 0.008, 0.009, 0.01, 0.011, 0.012, 0.013, 0.014, 0.015] # 0.1 # 0.001 # 0.01 # 0.001 #.001 # Weighting for CQL penalty term
    temp: 1.0 # Temperature for CQL penalty term
    num_samples: 10 # Number of samples for CQL penalty term

    batch_size: 1024 # [256, 512, 1024]  # Batch size for all networks
    hidden_dim: 128 # [64, 128, 256] # 256 # [[128, 128], [128, 256, 256]]  # Hidden dimension for all networks

    # Early stopping parameters (fixed for all combinations)
    early_stopping_flag: False  # Whether to use early stopping
    patience: 3        # Stop if no improvement for 15 evaluations
    eval_freq: 1       # Evaluate every 20 epochs  
    min_delta: 0.0001   # Minimum improvement threshold

    # validation loss
    loss_metric: "bellman_loss"  # Which metric to use for validation loss

    # include next actions
    include_next_actions: True  # needed for SARSA
    actions_shift: True # temporal shift to maintain causality.

    # gradient clipping
    grad_clip: 1.0

    actor_loss_q_scale: 10.
    actor_loss_gate_entropy_scale: 0. # 0.02 # 5.e-4
    actor_loss_mag_entropy_scale: 0. # 5.e-4

    vaso_mean_reg_scale: 0. # [0.0005, 0.001, 0.002, 0.005] # [0.001, 0.005, 0.01, 0.025]  
    
    use_compressed_latents: False  # Whether to use compressed latents as states instead of raw features or transformer output - specific to basic Q model, not used for TD3-BC or CQL

    # get temp
    gate_temp_start: 1.0   # e.g. 1.0
    gate_temp_end: 0.3       # e.g. 0.3

    n_step: 0  # Number of steps to use for n-step returns (set to 1 or None to disable n-step returns)
