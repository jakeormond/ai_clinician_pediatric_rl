    project: "AI_Clininician"
    "group": "reinforcement_learning"
    name: "cvp"
    
    tuning: True
    
    n_episodes: 1000  # How many episodes run during evaluation
    # n_epochs: 10  # Max time steps to run environment - should be 1000, but for testing we set to 10 - NOW ADDED TO COMMAND LINE ARGUMENTS
    checkpoints_path: "/home/jake/Documents/AI_Clinician/model_checkpoints"  # Save path
    discount: 0.8 # 0.999  # Discount factor
    # frac: 0.  # Best data fraction to use - NOW ADDED TO COMMAND LINE ARGUMENTS
    # max_traj_len: 2000  # Max trajectory length - probably need to change this
    device: "cuda"  # Device (cuda or cpu)
    
    learning_rate_critic: "loguniform(6e-7, 6e-6)" # "loguniform(1e-4, 1e-3)"   
    learning_rate_actor: "loguniform(6e-7, 6e-6)" # "loguniform(1e-4, 1e-3)"   
    learning_rate_alpha: "loguniform(6e-7, 6e-6)" # "loguniform(1e-4, 1e-3)"
    
    dropout: 0.1 # "uniform(0.0, 0.5)"
    tau: [0.01, 0.005] # Target network update rate
    
    # weight_decay: 1e-4 # L2 regularization strength
    
    batch_norm: False  # Whether to use batch normalization
    
    zero_min_reward: False #translate all rewards to be positive
    
    importance_sampling: False # Whether to use importance sampling weights for critic loss
    
    target_entropy: 0.

    alpha_multiplier: 1.0  #

    use_automatic_entropy_tuning: True  # Whether to use automatic entropy tuning

    backup_entropy: False  # Use backup entropy

    actor_optim: "adam"
    q_optim: "adam"
    alpha_optim: "sgd"

    bc_steps: 0  # Number of initial BC pretraining steps (i think other algorithms using something similar)

    target_update_period: 1  # Frequency of target nets updates

    pvp_n_actions: 10  # Number of actions to sample for PVP penalty

    q_min: 0. # if zero_min_reward is False, this should be a baseline "bad" value for a random policy essentially, but you can think of it as a hyperparameter

    pvp_alpha: 10.  # Weighting for PVP penalty

    next_state_reg: False  # Whether to include next state regularization term in critic loss

    policy_log_std_multiplier: 1.0  # Stochastic policy std multiplier

    orthogonal_init: True  # Whether to use orthogonal initialization for network weights

    ncp_samples: False # not sure what this does, will have to analyze
    
    ood_action_var: 0.2 # only use if ncp_samples is True
    
    
    
    # policy_noise: 0.2 # Noise added to target policy during critic updates
    # noise_clip: 0.5 # Range to clip target policy noise
    # policy_freq: 2 # Frequency of delayed policy updates
    # beta: 0.1 # Weighting for BC loss term
    # cql_alpha: [0.01, 0.05, 0.1] # [0.1, 0.2, 0.5] # [1.0, 5.0, 10.0] # Weighting for CQL penalty term
    # temp: [5.0, 10.0] # [2.0, 5.0] # Temperature for CQL penalty term
    # num_samples: 10 # Number of samples for CQL penalty term

    batch_size: 1024 # [256, 512, 1024]  # Batch size for all networks
    # hidden_dim: [[128, 128], [128, 256, 256]]  # Hidden dimension for all networks

    # Early stopping parameters (fixed for all combinations)
    early_stopping_flag: False  # Whether to use early stopping
    patience: 3        # Stop if no improvement for 15 evaluations
    eval_freq: 1       # Evaluate every 20 epochs  
    min_delta: 0.0001   # Minimum improvement threshold

    # evaluation parameters
    monitor_v0: True  # Whether to monitor V0 during training - specific to TD3-BC

    # validation loss
    loss_metric: "bellman_loss"  # Which metric to use for validation loss

    # changes to reward structure
    make_rewards_positive: False  # Whether to shift rewards to be positive

    # include next actions
    include_next_actions: True  # needed for SARSA

    # gradient clipping
    # grad_clip: 0.5
    grad_norm_max_actor: 1.0
    grad_norm_max_critic: 1.0

    # reward scaling
    reward_scaling: 1.5  # Scaling factor for rewards
    health_score_scale: 0.1  # Scaling factor for health score component of reward
    health_score_hourly_change_scale: 0.5  # Scaling factor for hourly change component of reward