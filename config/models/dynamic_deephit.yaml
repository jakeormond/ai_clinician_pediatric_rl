project: "AI_Clininician"
"group": "supervised_learning"
name: "dynamic_deephit_loss"
# n_epochs: command line argument
checkpoints_path: "/home/jake/Documents/AI_Clinician/model_checkpoints"  # Save path
window_length: 72 # Prediction horizon in hours - so 1 month
device: "cuda"  # Device (cuda or cpu)

tuning: True
use_windows_from_memory: True  # Whether to load precomputed windows into memory (only for smaller datasets)

learning_rate: 5.30e-5 # "loguniform(1e-6, 1e-4)"          #      [1e-6]  # Learning rates to try - 1e-4 overfits quickly
dropout: 0.3833 # "uniform(0.2, 0.6)"
weight_decay: 6.40e-5 # "loguniform(1e-5, 1e-2)"
use_layernorm: True
batch_size: 1024  # Batch size for all networks
hidden_dim: loguniform(32, 256) # 64  # Hidden dimension for all networks
attn_hidden_dim: loguniform(32, 256)
n_layers: [1, 2, 3, 4] # 2

loss_metric: "combined_loss"  # Which metric to use for early stopping
max_val_samples: 5000  # Max samples to use for validation during training

l1_lambda: 1e-4  # L1 regularization weight for classification head

alpha_class: 0.2
alpha_rank: 4.0 # 4.0   # Weight for ranking loss
alpha_pred: 0.4
sigma: 0.1

# Early stopping parameters (fixed for all combinations)
patience: 10        # Stop if no improvement for 15 evaluations
eval_freq: 1       # Evaluate every 20 epochs  
min_delta: 0.0001   # Minimum improvement threshold

grad_clip: 1  # Gradient clipping value