project: "AI_Clininician"
"group": "supervised_learning"
name: "dynamic_deephit_loss"
# n_epochs: command line argument
checkpoints_path: "/home/jake/Documents/AI_Clinician/model_checkpoints"  # Save path
window_length: 72 # Prediction horizon in hours - so 1 month
device: "cuda"  # Device (cuda or cpu)

tuning: True
use_windows_from_memory: False  # Whether to load precomputed windows into memory (only for smaller datasets)

learning_rate: "loguniform(1e-6, 1e-4)"  # Learning rates to try - 1e-4 overfits quickly
dropout: "uniform(0.1, 0.7)" # 
weight_decay: "loguniform(1e-5, 1e-2)" # "loguniform(1e-5, 1e-2)"
use_layernorm: True
batch_size: 64  # Batch size for all networks

hidden_dim: [32, 64, 128] # loguniform(32, 256) # 64  # Hidden dimension for all networks
attn_hidden_dim: [32, 64, 128, 256] # loguniform(32, 256)
n_layers: [1, 2, 3, 4] # [1, 2, 3, 4] # 2

loss_metric: "weighted_multi_C"  # Which metric to use for early stopping
max_val_samples: 5000  # Max samples to use for validation during training

l1_lambda: "loguniform(1e-6, 1e-4)"  # L1 regularization weight for classification head

alpha_class: 0.1  # Weight for classification loss
alpha_rank: [1.0, 2.0]   # Weight for ranking loss
alpha_pred: [0.5, 1.0, 2.0]  # Weight for prediction loss
sigma: [0.1, 0.2, 0.3] # for ranking loss

# gaussian sigma scheduling parameters
start_sigma: 2.
end_sigma: [0.3, 0.5, 0.7]

# learning rate scheduling parameters
pct_start: [0.1, 0.3, 0.5]
div_factor: [10, 25, 50]

# Early stopping parameters (fixed for all combinations)
patience: 10        # Stop if no improvement for 15 evaluations
eval_freq: 1       # Evaluate every 20 epochs  
min_delta: 0.0001   # Minimum improvement threshold

grad_clip: [0.1, 0.5, 1.0, 5.0]  # Gradient clipping value

# for controls
shuffle_inputs: False  # Whether to shuffle feature columns to confirm transformer not looking ahead
zero_inputs: False  # Whether to zero out feature columns to confirm transformer not looking ahead