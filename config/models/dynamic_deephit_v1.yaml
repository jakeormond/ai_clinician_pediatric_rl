    project: "AI_Clininician"
    "group": "supervised_learning"
    name: "dynamic_deephit_loss"
    # n_epochs: 100  # Max time steps to run environment - should be 1000, but for testing we set to 10 - NOW ADDED TO COMMAND LINE ARGUMENTS
    checkpoints_path: "/home/jake/Documents/AI_Clinician/model_checkpoints"  # Save path
    window_length: 72 # Prediction horizon in hours - so 1 month
    device: "cuda"  # Device (cuda or cpu)
    learning_rate: "loguniform(1e-3, 2e-3)"           #      [1e-6]  # Learning rates to try
    dropout: 0.5 # "uniform(0.2, 0.25)"
    batch_size: [128]  # Batch size for all networks
    hidden_dim: [64]  # Hidden dimension for all networks
    attn_hidden_dim: [64]
    n_layers: [2]

    loss_metric: "combined_loss"  # Which metric to use for early stopping
    max_val_samples: 5000  # Max samples to use for validation during training

    alpha_rank: "loguniform(5e-1, 1.5)"   # Weight for ranking loss
